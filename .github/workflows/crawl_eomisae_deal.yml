name: Crawl Eomisae (Deal)

on:
  schedule:
    - cron: '0 */2 * * *'  # 2시간마다 실행 (eomisae.co.kr이 hotlink.kr 서버 IP를 403으로 차단해 Actions에서 대신 크롤링)
  workflow_dispatch:

concurrency:
  group: crawl-eomisae-deal

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl, dom, mbstring

      - name: Random delay (요청 시각을 매번 다르게 흩뿌려 고정 간격 패턴을 피함)
        if: github.event_name == 'schedule'
        run: |
          DELAY=$((RANDOM % 6000))  # 0~99분 사이 무작위 대기
          echo "무작위 대기: ${DELAY}초"
          sleep "$DELAY"

      - name: Crawl Eomisae
        run: |
          echo "크롤링 시작..."
          php deal/eomisae_cli.php > /tmp/eomisae_items.json
          echo "파싱 결과:"
          cat /tmp/eomisae_items.json | python3 -m json.tool --no-ensure-ascii || cat /tmp/eomisae_items.json

      - name: Save to DB via API
        env:
          API_URL: ${{ secrets.HOTLINK_CRAWLER_API_URL }}
          API_KEY: ${{ secrets.HOTLINK_CRAWLER_API_KEY }}
        run: |
          SAVE_URL=$(python3 -c "print('$API_URL'.replace('crawler/api/save_posts.php', 'deal/api/save_deal_posts.php'))")
          echo "저장 엔드포인트: $SAVE_URL"
          for attempt in 1 2 3; do
            BODY=$(curl -s -X POST "$SAVE_URL" \
              -H "Content-Type: application/json; charset=utf-8" \
              -H "X-API-Key: $API_KEY" \
              -d @/tmp/eomisae_items.json)
            if echo "$BODY" | python3 -c "import json,sys; json.load(sys.stdin)" 2>/dev/null; then
              echo "서버 응답(시도 ${attempt}): $BODY"
              exit 0
            fi
            echo "시도 ${attempt} 실패(JSON 아님), 5초 후 재시도..."
            sleep 5
          done
          echo "3회 모두 실패, 응답: $BODY"
          exit 1
