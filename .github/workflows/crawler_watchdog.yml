name: Crawler Watchdog

on:
  schedule:
    - cron: '*/15 * * * *'  # 15분마다 상태 체크, 이상 있으면 서버가 Slack 알림 발송
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check crawler health
        env:
          API_KEY: ${{ secrets.HOTLINK_CRAWLER_API_KEY }}
        run: |
          # hotlink.kr 호스팅사의 봇 차단이 간헐적으로 Actions IP를 챌린지 페이지로
          # 막을 때가 있어, JSON이 올 때까지 최대 3회 재시도한다.
          for attempt in 1 2 3; do
            BODY=$(curl -s -H "X-API-Key: $API_KEY" "https://hotlink.kr/crawler/api/watchdog.php")
            if echo "$BODY" | python3 -c "import json,sys; json.load(sys.stdin)" 2>/dev/null; then
              echo "응답(시도 ${attempt}): $BODY"
              exit 0
            fi
            echo "시도 ${attempt} 실패(JSON 아님), 5초 후 재시도..."
            sleep 5
          done
          echo "3회 모두 실패, 응답: $BODY"
          exit 1
