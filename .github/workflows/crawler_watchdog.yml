name: Crawler Watchdog

on:
  schedule:
    - cron: '*/15 * * * *'  # 15분마다 상태 체크, 이상 있으면 서버가 Slack 알림 발송
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check crawler health
        env:
          API_KEY: ${{ secrets.HOTLINK_CRAWLER_API_KEY }}
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -H "X-API-Key: $API_KEY" \
            "https://hotlink.kr/crawler/api/watchdog.php")
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS")
          echo "HTTP 상태코드: $HTTP_STATUS"
          echo "응답: $BODY"
