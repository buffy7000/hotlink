name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FTP 배포
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./
          server-dir: /hotlink.kr/
          protocol: ftps
          port: 21
          exclude: |
            .github/**
            README.md
            .git/**
            stocks/**
            config/db_credentials.php
            coupang/coupang_credentials.php
            crawler/config/crawler_api_key.php
            crawler/config/slack_webhook.php
            job/config/job_api_key.php