name: Crawl DesignNine

on:
  schedule:
    - cron: '0 */6 * * 1-5'  # UTC 기준 6시간 간격, 월~금
  workflow_dispatch:           # GitHub UI에서 수동 실행 가능

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl, dom, mbstring

      - name: Check port connectivity
        run: |
          echo "포트 연결 테스트..."
          curl -v --max-time 10 https://www.designnine.co.kr:40000/ 2>&1 | head -30 || true

      - name: Crawl DesignNine
        run: |
          echo "크롤링 시작..."
          php job/crawler_designnine_cli.php > /tmp/designnine_jobs.json
          echo "파싱 결과:"
          cat /tmp/designnine_jobs.json | python3 -m json.tool --no-ensure-ascii || cat /tmp/designnine_jobs.json

      - name: Save to DB via API
        env:
          API_URL: ${{ secrets.DESIGNNINE_API_URL }}  # https://hotlink.kr/job/api/save_jobs.php
          API_KEY: ${{ secrets.DESIGNNINE_API_KEY }}
        run: |
          RESPONSE=$(curl -s -X POST "$API_URL" \
            -H "Content-Type: application/json; charset=utf-8" \
            -H "X-API-Key: $API_KEY" \
            -d @/tmp/designnine_jobs.json)
          echo "서버 응답: $RESPONSE"
          echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); exit(0 if d.get('success') else 1)"
