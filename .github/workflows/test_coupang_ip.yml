name: Test Coupang IP Block (manual)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl

      - name: Test Coupang Goldbox API from Actions IP
        run: php coupang/test_ip_from_actions.php
