<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>쿠팡 골드박스 상품 목록</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .controls {
            padding: 20px 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }

        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 30px;
        }

        .product-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            border: 1px solid #e9ecef;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }

        .product-image {
            width: 100%;
            height: 200px;
            background: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .product-image img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .product-card:hover .product-image img {
            transform: scale(1.05);
        }

        .product-info {
            padding: 20px;
        }

        .product-name {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            line-height: 1.4;
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-price {
            font-size: 20px;
            font-weight: bold;
            color: #e74c3c;
            margin-bottom: 15px;
        }

        .product-meta {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .badge.rocket {
            background: #ff6b6b;
            color: white;
        }

        .badge.free-shipping {
            background: #4ecdc4;
            color: white;
        }

        .badge.category {
            background: #f8f9fa;
            color: #666;
        }

        .product-link {
            display: block;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .product-link:hover {
            background: linear-gradient(135deg, #5a67d8, #6b5b95);
            transform: translateY(-1px);
        }

        .error {
            background: #fee;
            border: 1px solid #fcc;
            color: #c66;
            padding: 20px;
            margin: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stats {
            background: #f8f9fa;
            padding: 20px 30px;
            border-top: 1px solid #e9ecef;
            text-align: center;
            color: #666;
        }

        .update-time {
            font-size: 12px;
            color: #999;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎁 쿠팡 골드박스</h1>
            <p>매일 오전 7:30 업데이트되는 특가 상품들</p>
        </div>
        
        <div class="controls">
            <button id="loadProducts" class="btn">상품 목록 불러오기</button>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>골드박스 상품을 불러오는 중...</p>
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div id="productsContainer" class="products-grid"></div>

        <div id="stats" class="stats" style="display: none;">
            <div id="statsContent"></div>
            <div class="update-time">* 골드박스 상품은 매일 오전 7:30에 업데이트됩니다</div>
        </div>
    </div>

    <script>
        // API 설정
        const API_CONFIG = {
            ACCESS_KEY: '***REMOVED***',
            SECRET_KEY: '***REMOVED***',
            SUB_ID: 'hotlink',
            IMAGE_SIZE: '80x80',
            BASE_URL: 'https://api-gateway.coupang.com'
        };

        // HMAC 서명 생성 함수
        async function generateHMACSignature(method, path) {
            const now = new Date();
            const datetime = now.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '').replace('T', 'T').replace('Z', 'Z');
            const message = datetime + method + path.replace(/\?.*/, '');
            
            // crypto-js가 없으므로 Web Crypto API 사용
            const encoder = new TextEncoder();
            const key = await crypto.subtle.importKey(
                'raw',
                encoder.encode(API_CONFIG.SECRET_KEY),
                { name: 'HMAC', hash: 'SHA-256' },
                false,
                ['sign']
            );
            
            const signature = await crypto.subtle.sign('HMAC', key, encoder.encode(message));
            const hashArray = Array.from(new Uint8Array(signature));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            
            return {
                datetime,
                signature: hashHex
            };
        }

        // API 호출 함수
        async function fetchGoldboxProducts() {
            try {
                const method = 'GET';
                const path = `/v2/providers/affiliate_open_api/apis/openapi/v1/products/goldbox?subId=${API_CONFIG.SUB_ID}&imageSize=${API_CONFIG.IMAGE_SIZE}`;
                
                const { datetime, signature } = await generateHMACSignature(method, path);
                
                const authorization = `CEA algorithm=HmacSHA256, access-key=${API_CONFIG.ACCESS_KEY}, signed-date=${datetime}, signature=${signature}`;
                
                const response = await fetch(API_CONFIG.BASE_URL + path, {
                    method: method,
                    headers: {
                        'Authorization': authorization,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();
                
                if (data.rCode === '0') {
                    return data.data;
                } else {
                    throw new Error(data.rMessage || '알 수 없는 오류가 발생했습니다.');
                }
            } catch (error) {
                console.error('API 호출 오류:', error);
                throw error;
            }
        }

        // 가격 포맷팅 함수
        function formatPrice(price) {
            return new Intl.NumberFormat('ko-KR').format(price) + '원';
        }

        // 상품 카드 생성 함수
        function createProductCard(product) {
            const badges = [];
            if (product.isRocket) badges.push('<span class="badge rocket">로켓배송</span>');
            if (product.isFreeShipping) badges.push('<span class="badge free-shipping">무료배송</span>');
            if (product.categoryName) badges.push(`<span class="badge category">${product.categoryName}</span>`);

            return `
                <div class="product-card">
                    <div class="product-image">
                        <img src="${product.productImage}" alt="${product.productName}" loading="lazy">
                    </div>
                    <div class="product-info">
                        <div class="product-name">${product.productName}</div>
                        <div class="product-price">${formatPrice(product.productPrice)}</div>
                        <div class="product-meta">
                            ${badges.join('')}
                        </div>
                        <a href="${product.productUrl}" target="_blank" class="product-link" rel="noopener noreferrer">
                            상품 보러가기
                        </a>
                    </div>
                </div>
            `;
        }

        // 상품 목록 표시 함수
        function displayProducts(products) {
            const container = document.getElementById('productsContainer');
            const statsContainer = document.getElementById('stats');
            const statsContent = document.getElementById('statsContent');
            
            if (!products || products.length === 0) {
                container.innerHTML = '<div class="error">현재 골드박스 상품이 없습니다.</div>';
                return;
            }

            container.innerHTML = products.map(product => createProductCard(product)).join('');
            
            // 통계 정보 표시
            const rocketCount = products.filter(p => p.isRocket).length;
            const freeShippingCount = products.filter(p => p.isFreeShipping).length;
            const avgPrice = Math.round(products.reduce((sum, p) => sum + p.productPrice, 0) / products.length);
            
            statsContent.innerHTML = `
                총 <strong>${products.length}개</strong> 상품 | 
                로켓배송 <strong>${rocketCount}개</strong> | 
                무료배송 <strong>${freeShippingCount}개</strong> | 
                평균가격 <strong>${formatPrice(avgPrice)}</strong>
            `;
            
            statsContainer.style.display = 'block';
        }

        // 오류 표시 함수
        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        // 로딩 상태 제어 함수
        function setLoading(isLoading) {
            const loadingDiv = document.getElementById('loading');
            const loadButton = document.getElementById('loadProducts');
            
            if (isLoading) {
                loadingDiv.style.display = 'block';
                loadButton.disabled = true;
                loadButton.textContent = '불러오는 중...';
            } else {
                loadingDiv.style.display = 'none';
                loadButton.disabled = false;
                loadButton.textContent = '상품 목록 불러오기';
            }
        }

        // 메인 실행 함수
        async function loadProducts() {
            setLoading(true);
            document.getElementById('error').style.display = 'none';
            document.getElementById('productsContainer').innerHTML = '';
            document.getElementById('stats').style.display = 'none';

            try {
                const products = await fetchGoldboxProducts();
                displayProducts(products);
            } catch (error) {
                showError(`상품을 불러오는데 실패했습니다: ${error.message}`);
            } finally {
                setLoading(false);
            }
        }

        // 이벤트 리스너 등록
        document.getElementById('loadProducts').addEventListener('click', loadProducts);

        // 페이지 로드시 자동 실행
        document.addEventListener('DOMContentLoaded', loadProducts);
    </script>
</body>
</html>
