<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<meta name="description" content="{{META_DESCRIPTION}}">
<link rel="canonical" href="{{CANONICAL_URL}}">

<meta property="og:type" content="website">
<meta property="og:site_name" content="핫링크">
<meta property="og:title" content="{{OG_TITLE}}">
<meta property="og:description" content="{{OG_DESCRIPTION}}">
<meta property="og:url" content="{{CANONICAL_URL}}">
<meta property="og:locale" content="ko_KR">

<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/topic/assets/topic.css">
<link rel="stylesheet" href="/assets/trending-bar.css">
</head>
<body data-keyword="{{KEYWORD}}">

<div class="wrap">
  <div class="trending-bar">
    <div class="trending-bar-label">🔥 인기급상승 토픽</div>
    <div class="trending-bar-list"><span class="trending-bar-empty">불러오는 중...</span></div>
  </div>

  <div class="breadcrumb"><a href="/">핫링크</a> › <a href="/topic/">토픽</a> › {{KEYWORD}}</div>

  <div class="header">
    <h1>{{KEYWORD}}</h1>
    <div class="subtitle">커뮤니티 반응 모아보기</div>
    <div class="badges">
      {{TRENDING_BADGE}}
      <span class="badge">참여 커뮤니티 {{COMMUNITY_COUNT}}개</span>
      <span class="badge">글 {{POST_COUNT}}</span>
      <span class="badge">댓글 {{COMMENT_COUNT}}</span>
      <span class="badge">마지막 갱신 {{LAST_UPDATED}}</span>
    </div>
  </div>

  <div class="section">
    <div class="section-title">커뮤니티별 인기글</div>
    <div class="panel">
      {{COMMUNITY_SUMMARY_ROWS}}
    </div>
  </div>

  <div class="section">
    <div class="section-title">과거 이슈 타임라인</div>
    <div class="panel timeline">
      {{TIMELINE_ITEMS}}
    </div>
  </div>

  <div class="footer">
    생성 시각 {{GENERATED_AT}} · <a href="/">hotlink.kr</a>
  </div>
</div>

<script src="/topic/assets/topic.js"></script>
<script src="/assets/trending-bar.js"></script>
</body>
</html>
