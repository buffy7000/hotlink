<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>작업 목록 - 핫링크</title>
<style>
  :root {
    --bg: #f8fafc;
    --surface: #ffffff;
    --text: #1e293b;
    --text2: #64748b;
    --border: #e2e8f0;
    --accent: #3b82f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    padding: 48px 20px 64px;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 26px; font-weight: 800; margin-bottom: 6px; }
  .subtitle { font-size: 14px; color: var(--text2); margin-bottom: 36px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }

  .card {
    display: block;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px 20px;
    text-decoration: none;
    color: inherit;
    transition: border-color .15s, transform .1s, box-shadow .15s;
  }
  .card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0,0,0,.06);
  }
  .card-emoji { font-size: 28px; margin-bottom: 10px; display: block; }
  .card-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .card-desc { font-size: 13px; color: var(--text2); line-height: 1.5; }
</style>
</head>
<body>

<div class="wrap">
  <h1>작업 목록</h1>
  <p class="subtitle">hotlink.kr에서 만든 것들</p>

  <div class="grid">
    <a class="card" href="/">
      <span class="card-emoji">🔗</span>
      <div class="card-title">핫링크 - 커뮤니티 인기글</div>
      <div class="card-desc">클리앙, 루리웹, 뽐뿌 등 주요 커뮤니티 인기글을 한 곳에서</div>
    </a>

    <a class="card" href="/job/">
      <span class="card-emoji">💼</span>
      <div class="card-title">프리랜서 모아</div>
      <div class="card-desc">여러 사이트의 프리랜서 채용 공고를 한 곳에서 모아보기</div>
    </a>

    <a class="card" href="/mvno/">
      <span class="card-emoji">📱</span>
      <div class="card-title">알뜰폰 이벤트</div>
      <div class="card-desc">알뜰폰 이벤트를 큐레이션해서 모아보기</div>
    </a>

    <a class="card" href="/stocks/">
      <span class="card-emoji">🦜</span>
      <div class="card-title">껄무새 계산기</div>
      <div class="card-desc">그때 샀더라면 얼마를 벌었을까</div>
    </a>

    <a class="card" href="/tax/">
      <span class="card-emoji">📄</span>
      <div class="card-title">종합소득세 자료 제출 포털</div>
      <div class="card-desc">프리랜서용 서류 제출 신청 포털</div>
    </a>

    <a class="card" href="/ddiddiddi/">
      <span class="card-emoji">🎵</span>
      <div class="card-title">띠띠띠 집중 타이머</div>
      <div class="card-desc">수학 문제 집중력 부스터</div>
    </a>
  </div>
</div>

</body>
</html>
