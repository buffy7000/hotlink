<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>국기 색칠하기 - 세계 국기 학습</title>
<meta name="description" content="세계 50개국 국기를 클릭해서 직접 색칠해보세요">
<style>
  :root {
    --bg: #f4f6fb;
    --surface: #ffffff;
    --text: #1e293b;
    --text2: #64748b;
    --border: #e2e8f0;
    --accent: #2563eb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  .topbar { display: flex; align-items: baseline; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  h1 { font-size: 22px; font-weight: 800; }
  .back-link { font-size: 13px; color: var(--text2); text-decoration: none; }
  .back-link:hover { color: var(--accent); }

  .hidden { display: none !important; }

  /* ── 국가 선택 화면 ─────────────────────────────── */
  .select-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; }
  .flag-card { border: 2px solid var(--border); border-radius: 12px; padding: 8px; cursor: pointer; background: var(--surface); text-align: center; }
  .flag-card:hover { border-color: var(--accent); }
  .flag-card svg { width: 100%; aspect-ratio: 3/2; display: block; border-radius: 4px; border: 1px solid var(--border); margin-bottom: 6px; }
  .flag-card .flag-name { font-size: 12px; font-weight: 700; color: var(--text); }

  /* ── 색칠 화면 ──────────────────────────────────── */
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
  .panel-title { font-size: 13px; font-weight: 700; color: var(--text2); margin-bottom: 10px; }

  .color-header { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 16px; position: relative; }
  .change-country-btn { position: absolute; left: 0; font-size: 13px; font-weight: 700; color: var(--text2); background: none; border: none; cursor: pointer; }
  .change-country-btn:hover { color: var(--accent); }
  .country-name { font-size: 20px; font-weight: 800; text-align: center; }

  .canvas-area { text-align: center; }
  #colorSvg { width: 100%; max-width: 480px; aspect-ratio: 3/2; border-radius: 12px; border: 2px solid var(--border); background: #fff; touch-action: manipulation; }
  #colorSvg path { cursor: pointer; stroke: #94a3b8; stroke-width: 1; }
  #colorSvg path:hover { stroke: var(--accent); stroke-width: 2; }

  /* 참고용 실제 색상 국기는 색칠 캔버스 바깥, 하단에 별도로 표시 */
  .ref-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 14px; }
  .ref-thumb { width: 70px; aspect-ratio: 3/2; border-radius: 6px; border: 1px solid var(--border); overflow: hidden; flex-shrink: 0; }
  .ref-thumb svg { width: 100%; height: 100%; display: block; }
  .ref-label { font-size: 12px; color: var(--text2); }

  .toolbar { display: flex; justify-content: center; gap: 10px; margin: 18px 0; flex-wrap: wrap; }
  .btn { padding: 10px 18px; border-radius: 12px; border: 2px solid var(--border); background: var(--surface); font-size: 14px; font-weight: 700; cursor: pointer; color: var(--text); }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: .4; cursor: default; border-color: var(--border); color: var(--text); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { opacity: .9; color: #fff; }

  .palette { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 6px; }
  .swatch { width: 30px; height: 30px; border-radius: 8px; border: 2px solid var(--border); cursor: pointer; padding: 0; }
  .swatch.active { border-color: var(--text); box-shadow: 0 0 0 2px var(--accent); }
  .swatch.white { border-color: #cbd5e1; }
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <h1>🎨 국기 색칠하기</h1>
    <a class="back-link" href="index.html">← 세계 국기 학습으로</a>
  </div>

  <!-- 국가 선택 화면 -->
  <div id="selectScreen">
    <div class="panel-title">색칠할 국가를 선택하세요</div>
    <div class="select-grid" id="selectGrid"></div>
  </div>

  <!-- 색칠 화면 -->
  <div id="colorScreen" class="panel canvas-area hidden">
    <div class="color-header">
      <button class="change-country-btn" id="changeCountryBtn">← 다른 국가 선택</button>
      <div class="country-name" id="countryName">-</div>
    </div>

    <svg id="colorSvg" viewBox="0 0 300 200"></svg>

    <div class="ref-row">
      <div class="ref-thumb"><svg id="refSvg" viewBox="0 0 300 200"></svg></div>
      <div class="ref-label">← 실제 색상 참고용 이미지</div>
    </div>

    <div class="toolbar">
      <button class="btn" id="undoBtn" disabled>↶ 이전으로</button>
      <button class="btn" id="resetBtn">↺ 다시 칠하기</button>
      <a class="btn primary" id="printLink" href="print.html">🖨️ 이 국기 인쇄하기</a>
    </div>

    <div class="panel-title" style="margin-top:8px;">색상 팔레트</div>
    <div class="palette" id="palette"></div>
  </div>
</div>

<script src="flags-data.js"></script>
<script>
(function () {
  var SVG_NS = 'http://www.w3.org/2000/svg';
  var PALETTE = [
    '#FFFFFF','#000000','#EF4444','#B91C1C','#F97316','#F59E0B','#FDE047',
    '#22C55E','#15803D','#06B6D4','#3B82F6','#1D4ED8','#1E3A8A',
    '#8B5CF6','#EC4899','#78350F','#78716C','#CBD5E1'
  ];

  var currentColor = '#EF4444';
  var currentFlag = null;
  var UNDO_LIMIT = 3;
  var undoStack = [];

  function pushUndo(el, prevFill) {
    undoStack.push({ el: el, prevFill: prevFill });
    if (undoStack.length > UNDO_LIMIT) undoStack.shift();
    updateUndoBtn();
  }

  function updateUndoBtn() {
    document.getElementById('undoBtn').disabled = undoStack.length === 0;
  }

  function buildSvg(svgEl, flag, mode) {
    svgEl.innerHTML = '';
    flag.build().forEach(function (p) {
      var el = document.createElementNS(SVG_NS, 'path');
      el.setAttribute('d', p.d);
      if (p.fillRule) el.setAttribute('fill-rule', p.fillRule);
      if (mode === 'color') {
        el.setAttribute('fill', '#ffffff');
        el.dataset.trueColor = p.fill;
        el.addEventListener('click', function () {
          var prevFill = el.getAttribute('fill');
          if (prevFill === currentColor) return;
          pushUndo(el, prevFill);
          el.setAttribute('fill', currentColor);
        });
      } else {
        el.setAttribute('fill', p.fill);
      }
      svgEl.appendChild(el);
    });
  }

  function showSelectScreen() {
    document.getElementById('colorScreen').classList.add('hidden');
    document.getElementById('selectScreen').classList.remove('hidden');
    history.replaceState(null, '', location.pathname);
  }

  function openColorScreen(flag) {
    currentFlag = flag;
    document.getElementById('countryName').textContent = flag.name;
    buildSvg(document.getElementById('colorSvg'), flag, 'color');
    buildSvg(document.getElementById('refSvg'), flag, 'ref');
    document.getElementById('printLink').href = 'print.html?flag=' + flag.code;
    undoStack = [];
    updateUndoBtn();

    document.getElementById('selectScreen').classList.add('hidden');
    document.getElementById('colorScreen').classList.remove('hidden');
    history.replaceState(null, '', location.pathname + '?flag=' + flag.code);
    window.scrollTo(0, 0);
  }

  // 국가 선택 그리드
  var gridEl = document.getElementById('selectGrid');
  FLAGS.forEach(function (f) {
    var card = document.createElement('button');
    card.className = 'flag-card';
    var svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('viewBox', '0 0 300 200');
    f.build().forEach(function (p) {
      var el = document.createElementNS(SVG_NS, 'path');
      el.setAttribute('d', p.d);
      el.setAttribute('fill', p.fill);
      if (p.fillRule) el.setAttribute('fill-rule', p.fillRule);
      svg.appendChild(el);
    });
    card.appendChild(svg);
    var nameEl = document.createElement('div');
    nameEl.className = 'flag-name';
    nameEl.textContent = f.name;
    card.appendChild(nameEl);
    card.addEventListener('click', function () { openColorScreen(f); });
    gridEl.appendChild(card);
  });

  // 팔레트
  var paletteEl = document.getElementById('palette');
  PALETTE.forEach(function (c, i) {
    var b = document.createElement('button');
    b.className = 'swatch' + (c === '#FFFFFF' ? ' white' : '') + (i === 2 ? ' active' : '');
    b.style.background = c;
    b.addEventListener('click', function () {
      currentColor = c;
      document.querySelectorAll('.swatch').forEach(function (s) { s.classList.remove('active'); });
      b.classList.add('active');
    });
    paletteEl.appendChild(b);
  });

  // 이전으로 (최대 3단계 되돌리기)
  document.getElementById('undoBtn').addEventListener('click', function () {
    var last = undoStack.pop();
    if (!last) return;
    last.el.setAttribute('fill', last.prevFill);
    updateUndoBtn();
  });

  // 다시 칠하기
  document.getElementById('resetBtn').addEventListener('click', function () {
    document.querySelectorAll('#colorSvg path').forEach(function (p) { p.setAttribute('fill', '#ffffff'); });
    undoStack = [];
    updateUndoBtn();
  });

  // 다른 국가 선택
  document.getElementById('changeCountryBtn').addEventListener('click', showSelectScreen);

  // URL 파라미터로 특정 국가 바로 선택
  var qs = new URLSearchParams(location.search);
  var code = qs.get('flag');
  if (code) {
    var flag = FLAGS.find(function (f) { return f.code === code; });
    if (flag) openColorScreen(flag);
  }
})();
</script>
</body>
</html>
