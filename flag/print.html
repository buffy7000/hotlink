<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>국기 인쇄용 도안 - 세계 국기 학습</title>
<meta name="description" content="색상 참고 이미지가 포함된 흑백 국기 색칠 도안을 인쇄하세요">
<style>
  :root {
    --bg: #f4f6fb;
    --surface: #ffffff;
    --text: #1e293b;
    --text2: #64748b;
    --border: #e2e8f0;
    --accent: #2563eb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  .topbar { display: flex; align-items: baseline; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  h1 { font-size: 22px; font-weight: 800; }
  .back-link { font-size: 13px; color: var(--text2); text-decoration: none; }
  .back-link:hover { color: var(--accent); }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 20px; }
  .panel-title { font-size: 13px; font-weight: 700; color: var(--text2); margin-bottom: 12px; }

  .select-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .btn { padding: 9px 16px; border-radius: 10px; border: 2px solid var(--border); background: var(--surface); font-size: 13px; font-weight: 700; cursor: pointer; color: var(--text); }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; margin-left: auto; }
  .btn.primary:hover { opacity: .9; color: #fff; }

  .check-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; max-height: 320px; overflow-y: auto; }
  .check-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; font-size: 13px; }
  .check-item:hover { background: var(--bg); }
  .check-item svg { width: 28px; aspect-ratio: 3/2; border: 1px solid var(--border); border-radius: 3px; flex-shrink: 0; }

  .preview-title { font-size: 13px; font-weight: 700; color: var(--text2); margin: 24px 0 12px; }

  .sheet {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    max-width: 560px;
    margin: 0 auto 24px;
    padding: 28px;
    position: relative;
  }
  .sheet-ref { position: absolute; top: 20px; left: 20px; width: 90px; }
  .sheet-ref svg { width: 100%; aspect-ratio: 3/2; border: 1px solid #333; display: block; }
  .sheet-ref-label { font-size: 10px; color: var(--text2); text-align: center; margin-top: 3px; }
  .sheet-title { text-align: center; font-size: 20px; font-weight: 800; margin-bottom: 18px; }
  .sheet-outline svg { width: 100%; aspect-ratio: 3/2; display: block; }
  .sheet-outline path { fill: #ffffff; stroke: #333; stroke-width: 1.2; }

  @media print {
    body { background: #fff; padding: 0; }
    .no-print { display: none !important; }
    .sheet { border: none; border-radius: 0; box-shadow: none; max-width: 100%; page-break-after: always; padding: 12mm; }
    .sheet:last-child { page-break-after: auto; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar no-print">
    <h1>🖨️ 국기 인쇄용 도안</h1>
    <a class="back-link" href="index.html">← 세계 국기 학습으로</a>
  </div>

  <div class="panel no-print">
    <div class="panel-title">인쇄할 국가 선택</div>
    <div class="select-row">
      <button class="btn" id="selectAllBtn">전체 선택</button>
      <button class="btn" id="selectNoneBtn">전체 해제</button>
      <button class="btn primary" id="printBtn">🖨️ 선택한 도안 인쇄하기</button>
    </div>
    <div class="check-grid" id="checkGrid"></div>
  </div>

  <div class="preview-title no-print" id="previewTitle"></div>
  <div id="sheets"></div>
</div>

<script src="flags-data.js"></script>
<script>
(function () {
  var SVG_NS = 'http://www.w3.org/2000/svg';
  var selected = {};

  function renderThumbSvg(flag) {
    var svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('viewBox', '0 0 300 200');
    flag.build().forEach(function (p) {
      var el = document.createElementNS(SVG_NS, 'path');
      el.setAttribute('d', p.d);
      el.setAttribute('fill', p.fill);
      if (p.fillRule) el.setAttribute('fill-rule', p.fillRule);
      svg.appendChild(el);
    });
    return svg;
  }

  function renderOutlineSvg(flag) {
    var svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('viewBox', '0 0 300 200');
    flag.build().forEach(function (p) {
      var el = document.createElementNS(SVG_NS, 'path');
      el.setAttribute('d', p.d);
      if (p.fillRule) el.setAttribute('fill-rule', p.fillRule);
      svg.appendChild(el);
    });
    return svg;
  }

  // 선택 체크박스 목록
  var grid = document.getElementById('checkGrid');
  FLAGS.forEach(function (f) {
    var label = document.createElement('label');
    label.className = 'check-item';
    var cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.addEventListener('change', function () {
      selected[f.code] = cb.checked;
      renderSheets();
    });
    label.appendChild(cb);
    label.appendChild(renderThumbSvg(f));
    var span = document.createElement('span');
    span.textContent = f.name;
    label.appendChild(span);
    grid.appendChild(label);
    f._checkbox = cb;
  });

  function renderSheets() {
    var sheetsEl = document.getElementById('sheets');
    sheetsEl.innerHTML = '';
    var chosen = FLAGS.filter(function (f) { return selected[f.code]; });
    document.getElementById('previewTitle').textContent = chosen.length ? '미리보기 (' + chosen.length + '개국)' : '';
    chosen.forEach(function (f) {
      var sheet = document.createElement('div');
      sheet.className = 'sheet';

      var ref = document.createElement('div');
      ref.className = 'sheet-ref';
      ref.appendChild(renderThumbSvg(f));
      var refLabel = document.createElement('div');
      refLabel.className = 'sheet-ref-label';
      refLabel.textContent = '색상 참고';
      ref.appendChild(refLabel);
      sheet.appendChild(ref);

      var title = document.createElement('div');
      title.className = 'sheet-title';
      title.textContent = f.name;
      sheet.appendChild(title);

      var outline = document.createElement('div');
      outline.className = 'sheet-outline';
      outline.appendChild(renderOutlineSvg(f));
      sheet.appendChild(outline);

      sheetsEl.appendChild(sheet);
    });
  }

  document.getElementById('selectAllBtn').addEventListener('click', function () {
    FLAGS.forEach(function (f) { selected[f.code] = true; f._checkbox.checked = true; });
    renderSheets();
  });
  document.getElementById('selectNoneBtn').addEventListener('click', function () {
    FLAGS.forEach(function (f) { selected[f.code] = false; f._checkbox.checked = false; });
    renderSheets();
  });
  document.getElementById('printBtn').addEventListener('click', function () { window.print(); });

  // URL 파라미터로 특정 국가 미리 선택
  var qs = new URLSearchParams(location.search);
  var code = qs.get('flag');
  if (code) {
    var f = FLAGS.find(function (f) { return f.code === code; });
    if (f) { selected[code] = true; f._checkbox.checked = true; }
  } else {
    selected[FLAGS[0].code] = true;
    FLAGS[0]._checkbox.checked = true;
  }
  renderSheets();
})();
</script>
</body>
</html>
